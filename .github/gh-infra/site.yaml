apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: site
  owner: futabooo
spec:
  description: My Personal Site Powered by HonoX
  homepage: https://futabooo.com
  visibility: public
  archived: false
  topics:
  - astro
  - tailwindcss
  labels:
  - name: bug
    description: Something isn't working
    color: d73a4a
  - name: documentation
    description: Improvements or additions to documentation
    color: 0075ca
  - name: duplicate
    description: This issue or pull request already exists
    color: cfd3d7
  - name: enhancement
    description: New feature or request
    color: a2eeef
  - name: good first issue
    description: Good for newcomers
    color: 7057ff
  - name: help wanted
    description: Extra attention is needed
    color: 008672
  - name: invalid
    description: This doesn't seem right
    color: e4e669
  - name: question
    description: Further information is requested
    color: d876e3
  - name: wontfix
    description: This will not be worked on
    color: ffffff
  features:
    issues: true
    projects: true
    wiki: false
    discussions: false
    pull_requests: true
  merge_strategy:
    allow_merge_commit: true
    allow_squash_merge: true
    allow_rebase_merge: true
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: COMMIT_OR_PR_TITLE
    squash_merge_commit_message: COMMIT_MESSAGES
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
  release_immutability: false
  security:
    vulnerability_alerts: true
    automated_security_fixes: false
    private_vulnerability_reporting: false
  rulesets:
  - name: Default Ruleset
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
        - ~DEFAULT_BRANCH
    rules:
      pull_request:
        required_approving_review_count: 0
        dismiss_stale_reviews_on_push: false
        require_code_owner_review: false
        require_last_push_approval: false
        required_review_thread_resolution: false
      required_status_checks:
        strict_required_status_checks_policy: false
        contexts:
        - context: "Workers Builds: site"
      non_fast_forward: true
      deletion: true
      creation: false
      required_linear_history: false
      required_signatures: false
  - name: Protect default branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
        - ~DEFAULT_BRANCH
    rules:
      non_fast_forward: true
      deletion: true
      creation: false
      required_linear_history: false
      required_signatures: false
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: false
    workflow_permissions: read
    can_approve_pull_requests: false
    fork_pr_approval: first_time_contributors
